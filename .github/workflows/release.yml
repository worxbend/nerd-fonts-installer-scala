name: Release

on:
  push:
    tags:
      - "v*"
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish, for example v1.0.0 (must already exist)"
        required: true
        type: string

# Least privilege: each job declares its own permissions.
permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether a release build is needed
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            # A tag push or a workflow_dispatch re-publish always builds and publishes the named release.
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [[ -z "${before}" || "${before}" =~ ^0+$ ]] || ! git cat-file -e "${before}" 2>/dev/null; then
            # New branch, or a base commit we cannot diff against: build to be safe.
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if git diff --name-only "${before}" "${GITHUB_SHA}" \
               | grep -qE '^(app|cli|core|config)/|(^|/)build\.mill$|^mill$|^\.mill-version$|^\.github/workflows/release\.yml$'
          then
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
          else
            echo "relevant=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # native-image cannot cross-compile, so every target gets its own runner.
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Pin to the exact commit that triggered this run, not a branch name: `github.ref` is a moving
          # reference that actions/checkout re-resolves to the branch's CURRENT tip at checkout time, so a
          # push-triggered run whose branch moves during the (~10 min) build matrix would silently check out
          # a newer commit than the one that triggered it — breaking `git tag -f latest "${GITHUB_SHA}"` in
          # the publish job below with "nonexistent object" once the shallow, wrong-commit clone can't find
          # it. A workflow_dispatch re-publish must build the named tag instead of the dispatching commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.sha }}

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="latest"
          fi
          if [[ "${version}" != "latest" && ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify BuildInfo version matches the release tag
        if: steps.version.outputs.value != 'latest'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          expected="${VERSION#v}"
          actual="$(sed -n 's/^[[:space:]]*val project[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.mill | head -n1)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "build.mill Versions.project (\"${actual}\") does not match release tag ${VERSION}; update Versions.project before tagging." >&2
            exit 1
          fi

      - name: Cache Mill, Coursier and the toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/Library/Caches/Coursier
            ~/.cache/mill
            ~/.mill
          key: ${{ runner.os }}-${{ runner.arch }}-mill-${{ hashFiles('build.mill', 'mill', '.mill-version') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mill-

      - name: Compile and test
        run: |
          ./mill --no-daemon __.compile
          ./mill --no-daemon __.test

      - name: Build native image
        id: native
        shell: bash
        run: |
          set -euo pipefail
          NERD_FONTS_INSTALLER_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export NERD_FONTS_INSTALLER_BUILD_DATE
          ref="$(./mill --no-daemon show app.nativeImage | sed -n 's/^"\(.*\)"$/\1/p' | tail -n 1)"
          path="${ref##*:}"
          test -x "${path}"
          echo "path=${path}" >> "${GITHUB_OUTPUT}"

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TARGET: ${{ matrix.target }}
          BIN: ${{ steps.native.outputs.path }}
        run: |
          set -euo pipefail
          name="nerd-fonts-installer_${VERSION}_${TARGET}"
          mkdir -p "dist/${name}"
          cp "${BIN}" "dist/${name}/nerd-fonts-installer"
          chmod +x "dist/${name}/nerd-fonts-installer"
          cp LICENSE config.example.yaml "dist/${name}/"
          if [[ -f README.md ]]; then cp README.md "dist/${name}/"; fi
          "dist/${name}/nerd-fonts-installer" --version
          "dist/${name}/nerd-fonts-installer" --help > /dev/null
          # --version and --help never start a Netty event loop, so they pass even when the binary's HTTP
          # path is broken. This is the only check that proves the packaged binary can actually reach the
          # network, and it runs on every target -- including linux-arm64, which cannot be tested locally
          # because native-image does not cross-compile.
          scripts/ci/native-network-smoke.sh "dist/${name}/nerd-fonts-installer"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nerd-fonts-installer_${{ steps.version.outputs.value }}_${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [changes, build]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Match the build jobs (see the comment there): pin to `github.sha`, not the moving `github.ref`,
          # so this checkout — and `git tag -f latest "${GITHUB_SHA}"` below — see the commit that actually
          # triggered this run even if main has moved on by the time this job starts.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.sha }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Assemble checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f checksums.txt
          cat ./*.sha256 > checksums.txt
          rm -f ./*.sha256
          cp ../scripts/install.sh install.sh
          ls -la

      - name: Publish tagged release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          # A pre-release tag (v1.2.3-rc.1) must never become the repository's Latest release: that is
          # what scripts/install.sh resolves by default for anyone who has not pinned a version.
          if [[ "${TAG}" == *-* ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--latest)
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" "${flags[@]}"
          else
            gh release create "${TAG}" dist/* --verify-tag --generate-notes --title "${TAG}" "${flags[@]}"
          fi

      - name: Refresh moving latest release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f latest "${GITHUB_SHA}"
          git push --force origin refs/tags/latest
          notes="Automated build from ${GITHUB_SHA}. Asset names are stable; prefer a tagged release for pinning."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --target "${GITHUB_SHA}" --title "Latest build" --notes "${notes}" --prerelease --latest=false
            gh release upload latest dist/* --clobber
          else
            gh release create latest dist/* --target "${GITHUB_SHA}" --title "Latest build" --notes "${notes}" --prerelease --latest=false
          fi
