name: Bug report
description: Something behaves differently from what the documentation, the Go reference or common sense says.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a suspected security problem do not use this form; use
        [private vulnerability reporting](https://github.com/worxbend/nerd-fonts-installer-scala/security/advisories/new)
        instead (see `docs/SECURITY.md`).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `nerd-fonts-installer --version`
      placeholder: nerd-fonts-installer 0.1.0 (2e93312925a0, 2026-09-11T12:00:00Z)
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How was the binary installed
      options:
        - scripts/install.sh
        - Release tarball, by hand
        - Built locally with ./mill app.nativeImage
        - Run from source with ./mill app.run
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - linux-amd64
        - linux-arm64
        - macos-amd64
        - macos-arm64
        - other (say which below)
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command line and environment
      description: The exact command. Mention `NERD_FONTS_INSTALLER_CONFIG`, `TMPDIR`, `NO_COLOR` or `XDG_CONFIG_HOME` if set.
      render: shell
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config file
      description: The file that was used, or the `--dry-run` output. Remove anything private from paths.
      render: yaml
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Everything printed to stdout and stderr, and the exit code (`echo $?`).
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
        - label: I ran the same command with `--dry-run` and included its output if it differs.
        - label: I checked whether the Go reference (`worxbend/nerd-fonts-installer`) behaves the same way, if I have it.
