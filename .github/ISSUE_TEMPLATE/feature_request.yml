name: Feature request
description: Propose a behaviour change or an addition.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This project tracks the Go reference (`worxbend/nerd-fonts-installer`) closely: `docs/SPEC.md` is the
        contract and `docs/PARITY.md` lists the deliberate deviations. A proposal that changes user-visible
        behaviour is easier to accept when it says how it relates to the reference.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The flag, config key, output or behaviour you would like, as concretely as you can.
    validations:
      required: true
  - type: dropdown
    id: parity
    attributes:
      label: Relation to the Go reference
      options:
        - The Go tool already does this; this is a parity gap
        - The Go tool does not do this; it would be a deviation
        - Not applicable (build, docs, release process)
        - I do not know
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or why an existing option does not fit.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and `docs/SPEC.md`.
          required: true
        - label: I am willing to open a pull request for this.
