name: Feature request
description: Propose a behaviour change or an addition.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        `docs/SPEC.md` is the behavioural contract for this CLI. A proposal that changes user-visible
        behaviour is easier to accept when it says how it fits that contract.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The flag, config key, output or behaviour you would like, as concretely as you can.
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Is this a breaking change?
      options:
        - "No: it is additive and existing configs and commands keep working"
        - "Yes: it changes or removes existing behaviour"
        - Not applicable (build, docs, release process)
        - I do not know
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or why an existing option does not fit.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and `docs/SPEC.md`.
          required: true
        - label: I am willing to open a pull request for this.
